<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detaylı Finans ve Harcama Takipçisi</title>
    <!-- Grafik çizimi için Chart.js kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #4F46E5;
            --success: #10B981;
            --danger: #EF4444;
            --dark: #1F2937;
            --light: #F3F4F6;
            --white: #FFFFFF;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            color: var(--dark);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 30px;
        }
        /* Özet Kartları */
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: var(--white);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
        }
        .card h3 { margin: 0 0 10px 0; font-size: 16px; color: #6B7280; }
        .card p { margin: 0; font-size: 28px; font-weight: bold; }
        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }
        .text-primary { color: var(--primary); }

        /* Ana İçerik Izgarası */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        @media (max-width: 768px) {
            .main-grid { grid-template-columns: 1fr; }
        }
        
        .section-box {
            background: var(--white);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .section-box h2 { margin-top: 0; font-size: 18px; border-bottom: 1px solid #E5E7EB; padding-bottom: 10px; }

        /* Form Elemanları */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 14px; }
        .form-control {
            width: 100%; padding: 10px; border: 1px solid #D1D5DB;
            border-radius: 5px; box-sizing: border-box; font-family: inherit;
        }
        button {
            width: 100%; padding: 12px; background-color: var(--primary);
            color: white; border: none; border-radius: 5px;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        button:hover { background-color: #4338CA; }

        /* Tablo */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #E5E7EB; }
        th { background-color: #F9FAFB; font-weight: 600; }
        .btn-delete {
            background-color: var(--danger); padding: 5px 10px;
            font-size: 12px; width: auto; border-radius: 3px;
        }
        .btn-delete:hover { background-color: #DC2626; }
        
        .badge {
            padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold;
        }
        .badge-gelir { background-color: #D1FAE5; color: #065F46; }
        .badge-gider { background-color: #FEE2E2; color: #991B1B; }

        .chart-container { position: relative; height: 300px; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <h1>💸 Detaylı Finans ve Harcama Takipçisi</h1>

    <!-- Özet Alanı -->
    <div class="summary-cards">
        <div class="card">
            <h3>Kalan Bakiye</h3>
            <p class="text-primary" id="balance">0.00 ₺</p>
        </div>
        <div class="card">
            <h3>Toplam Gelir</h3>
            <p class="text-success" id="total-income">0.00 ₺</p>
        </div>
        <div class="card">
            <h3>Toplam Gider</h3>
            <p class="text-danger" id="total-expense">0.00 ₺</p>
        </div>
    </div>

    <div class="main-grid">
        <!-- Form Alanı -->
        <div class="section-box">
            <h2>Yeni İşlem Ekle</h2>
            <form id="transaction-form">
                <div class="form-group">
                    <label>İşlem Tipi</label>
                    <select id="type" class="form-control" required onchange="updateCategories()">
                        <option value="expense">Gider</option>
                        <option value="income">Gelir</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Kategori</label>
                    <select id="category" class="form-control" required>
                        <!-- Kategoriler JS ile dolacak -->
                    </select>
                </div>
                <div class="form-group">
                    <label>Miktar (₺)</label>
                    <input type="number" id="amount" class="form-control" placeholder="Örn: 150.50" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Tarih</label>
                    <input type="date" id="date" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Açıklama / Not</label>
                    <input type="text" id="note" class="form-control" placeholder="Örn: Market alışverişi" required>
                </div>
                <button type="submit">İşlemi Kaydet</button>
            </form>
        </div>

        <!-- Grafik Alanı -->
        <div class="section-box">
            <h2>Gider Dağılımı (Kategorilere Göre)</h2>
            <div class="chart-container">
                <canvas id="expenseChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Geçmiş İşlemler Tablosu -->
    <div class="section-box">
        <h2>Son İşlemler</h2>
        <div style="overflow-x: auto;">
            <table id="transactions-table">
                <thead>
                    <tr>
                        <th>Tarih</th>
                        <th>Tip</th>
                        <th>Kategori</th>
                        <th>Açıklama</th>
                        <th>Miktar</th>
                        <th>İşlem</th>
                    </tr>
                </thead>
                <tbody id="transaction-list">
                    <!-- İşlemler buraya eklenecek -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Kategoriler
    const categories = {
        expense: ['Market & Gıda', 'Fatura', 'Kira', 'Ulaşım', 'Eğlence', 'Giyim', 'Sağlık', 'Eğitim', 'Diğer'],
        income: ['Maaş', 'Yatırım', 'Freelance', 'Kira Geliri', 'Diğer']
    };

    let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
    let expenseChartInstance = null;

    // Sayfa Yüklendiğinde
    document.addEventListener('DOMContentLoaded', () => {
        // Tarih alanına bugünün tarihini atama
        document.getElementById('date').valueAsDate = new Date();
        updateCategories();
        updateUI();
    });

    // Kategori Seçeneklerini Güncelleme
    function updateCategories() {
        const type = document.getElementById('type').value;
        const categorySelect = document.getElementById('category');
        categorySelect.innerHTML = '';
        
        categories[type].forEach(cat => {
            const option = document.createElement('option');
            option.value = cat;
            option.textContent = cat;
            categorySelect.appendChild(option);
        });
    }

    // Form Gönderimi
    document.getElementById('transaction-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const type = document.getElementById('type').value;
        const category = document.getElementById('category').value;
        const amount = parseFloat(document.getElementById('amount').value);
        const date = document.getElementById('date').value;
        const note = document.getElementById('note').value;

        const transaction = {
            id: generateID(),
            type,
            category,
            amount,
            date,
            note
        };

        transactions.push(transaction);
        saveData();
        updateUI();
        
        // Formu temizle
        document.getElementById('amount').value = '';
        document.getElementById('note').value = '';
    });

    // Rastgele ID Üretici
    function generateID() {
        return Math.floor(Math.random() * 100000000);
    }

    // Verileri Local Storage'a Kaydetme
    function saveData() {
        localStorage.setItem('transactions', JSON.stringify(transactions));
    }

    // İşlem Silme
    function deleteTransaction(id) {
        transactions = transactions.filter(t => t.id !== id);
        saveData();
        updateUI();
    }

    // Arayüzü Güncelleme (Bakiye, Tablo, Grafik)
    function updateUI() {
        const list = document.getElementById('transaction-list');
        list.innerHTML = '';

        let totalIncome = 0;
        let totalExpense = 0;
        let expensesByCategory = {};

        // İşlemleri tarihe göre yeninden eskiye sırala
        const sortedTransactions = [...transactions].sort((a, b) => new Date(b.date) - new Date(a.date));

        sortedTransactions.forEach(t => {
            // Hesaplamalar
            if (t.type === 'income') {
                totalIncome += t.amount;
            } else {
                totalExpense += t.amount;
                // Grafik için kategori bazlı gider hesaplama
                expensesByCategory[t.category] = (expensesByCategory[t.category] || 0) + t.amount;
            }

            // Tabloya Ekleme
            const row = document.createElement('tr');
            const typeBadge = t.type === 'income' 
                ? '<span class="badge badge-gelir">Gelir</span>' 
                : '<span class="badge badge-gider">Gider</span>';
            
            const amountSign = t.type === 'income' ? '+' : '-';
            const amountColor = t.type === 'income' ? 'var(--success)' : 'var(--danger)';

            row.innerHTML = `
                <td>${formatDate(t.date)}</td>
                <td>${typeBadge}</td>
                <td>${t.category}</td>
                <td>${t.note}</td>
                <td style="color: ${amountColor}; font-weight: bold;">${amountSign}${t.amount.toFixed(2)} ₺</td>
                <td><button class="btn-delete" onclick="deleteTransaction(${t.id})">Sil</button></td>
            `;
            list.appendChild(row);
        });

        // Bakiyeleri Güncelleme
        const balance = totalIncome - totalExpense;
        document.getElementById('total-income').innerText = totalIncome.toFixed(2) + ' ₺';
        document.getElementById('total-expense').innerText = totalExpense.toFixed(2) + ' ₺';
        
        const balanceEl = document.getElementById('balance');
        balanceEl.innerText = balance.toFixed(2) + ' ₺';
        balanceEl.style.color = balance >= 0 ? 'var(--primary)' : 'var(--danger)';

        // Grafiği Güncelle
        updateChart(expensesByCategory);
    }

    // Tarih Formatlayıcı (GG.AA.YYYY)
    function formatDate(dateString) {
        const options = { year: 'numeric', month: '2-digit', day: '2-digit' };
        return new Date(dateString).toLocaleDateString('tr-TR', options);
    }

    // Chart.js Grafiği Oluşturma/Güncelleme
    function updateChart(expenseData) {
        const ctx = document.getElementById('expenseChart').getContext('2d');
        
        const labels = Object.keys(expenseData);
        const data = Object.values(expenseData);

        // Eğer gider yoksa boş grafik göster
        if (labels.length === 0) {
            labels.push('Henüz Gider Yok');
            data.push(1);
        }

        if (expenseChartInstance) {
            expenseChartInstance.destroy();
        }

        expenseChartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{
                    data: data,
                    backgroundColor: [
                        '#EF4444', '#F59E0B', '#10B981', '#3B82F6', 
                        '#8B5CF6', '#EC4899', '#14B8A6', '#6366F1', '#64748B'
                    ],
                    borderWidth: 2,
                    borderColor: '#ffffff'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'right' }
                }
            }
        });
    }
</script>

</body>
</html>
